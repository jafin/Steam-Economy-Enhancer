name: Build

permissions:
    contents: write

on:
    push:
        branches: [master]
        tags: ['v*']
    pull_request:

jobs:
    build:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history so `git describe` can find the most recent tag.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm typecheck

            - run: pnpm lint

            - run: pnpm format:check

            - run: pnpm test

            # Derives the userscript @version from the git tag, so it tracks releases:
            # v7.4.0 -> 7.4.0, and commits past a tag -> 7.4.0-beta.N. Falls back to the version
            # in package.json, which is what a local `pnpm build` uses.
            - name: Set version from git
              run: |
                  desc=$(git describe --tags --match 'v*' 2>/dev/null || echo "")
                  if [[ "$desc" =~ ^v([^-]+)$ ]]; then
                    echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
                  elif [[ "$desc" =~ ^v([^-]+)-([0-9]+)- ]]; then
                    echo "APP_VERSION=${BASH_REMATCH[1]}-beta.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
                  fi

            - run: pnpm build

            # dist/code.user.js is committed, because the raw GitHub URL is how people install
            # this. That only works if what is committed matches the source, so a stale artifact
            # fails the build rather than shipping quietly.
            #
            # The version is excluded from the comparison: CI derives it from the git tag, so it
            # legitimately differs from whatever a local build stamped in.
            - name: Check the committed artifact matches a fresh build
              run: |
                  if ! git diff --quiet -- dist/code.user.js; then
                    if [ -z "$(git diff -U0 -- dist/code.user.js | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '@version')" ]; then
                      echo "Only @version differs, which CI sets from the tag. OK."
                    else
                      echo "::error::dist/code.user.js is out of date. Run 'pnpm build' and commit the result."
                      git diff -- dist/code.user.js
                      exit 1
                    fi
                  fi

            # The metadata block is generated now, so this is where eslint-plugin-userscripts
            # earns its place: it checks the header where the header actually exists.
            - run: pnpm lint:dist

            - uses: actions/upload-artifact@v4
              with:
                  name: userscript
                  path: dist/code.user.js

            - name: Create GitHub Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/code.user.js
                  generate_release_notes: true

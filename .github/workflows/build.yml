name: Build

permissions:
    contents: write

# main, not master. master tracks upstream and stays vanilla JavaScript; this TypeScript line
# lives on main, so triggering on master meant the pipeline never ran against the code it was
# written for -- and the release job, gated on a tag that was never cut, never ran at all.
on:
    push:
        branches: [main]
    pull_request:

jobs:
    build:
        name: CI
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  # Full history and tags: the version is derived from the last tag and every
                  # commit message since it, so a shallow clone would compute the wrong number.
                  fetch-depth: 0

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm typecheck

            - run: pnpm lint

            - run: pnpm format:check

            - run: pnpm test

            # Reads the last tag and the conventional-commit messages since it. `version` is
            # what this build stamps, `release` says whether those commits warrant cutting a
            # release, and `tag` is the tag to cut if so. See scripts/version.ts.
            #
            # On a release run the build stamps the clean number rather than the -dev.N one,
            # which is why the version is decided here, before the build, rather than after.
            - name: Derive the version
              id: version
              run: node --experimental-strip-types scripts/print-version.ts >> "$GITHUB_OUTPUT"

            - run: pnpm build
              env:
                  APP_VERSION: ${{ steps.version.outputs.version }}

            # The metadata block is generated, so this is where eslint-plugin-userscripts
            # earns its place: it checks the header where the header actually exists.
            - run: pnpm lint:dist

            - uses: actions/upload-artifact@v4
              with:
                  name: userscript
                  path: dist/code.user.js

            # Releases are cut from main only, and only when the commits since the last tag
            # contain something worth releasing -- a feat, a fix, a perf or a breaking change.
            # A run of refactors and docs builds and lints, but ships nothing.
            #
            # The tag is created by the release itself rather than pushed separately, so the
            # tag and the asset can never disagree about what was released.
            - name: Release
              if: github.ref == 'refs/heads/main' && steps.version.outputs.release == 'true'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  target_commitish: ${{ github.sha }}
                  files: dist/code.user.js
                  generate_release_notes: true
